services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account -d account"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.7.2
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - SERVICES=sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:0.120.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"

  account-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/account
      DB_USER: account
      DB_PASSWORD: account
      SQS_ENABLED: "true"
      SQS_QUEUE_URL: http://localstack:4566/000000000000/transacoes-financeiras-processadas
      AWS_ENDPOINT_OVERRIDE: http://localstack:4566
      AWS_REGION: sa-east-1
      OTEL_METRICS_ENABLED: "false"
      OTEL_LOGS_ENABLED: "false"
    ports:
      - "8080:8080"
