apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  # HA starting point only — 2k EPS replica count is unproven (docs/design-doc.md §7.1).
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      serviceAccountName: account-service
      terminationGracePeriodSeconds: 60
      containers:
        - name: account-service
          image: ACCOUNT_SERVICE_IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: SQS_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: account-service
                  key: SQS_QUEUE_URL
            - name: SQS_EXPECTED_DLQ_ARN
              valueFrom:
                configMapKeyRef:
                  name: account-service
                  key: SQS_EXPECTED_DLQ_ARN
            - name: SQS_MAX_RECEIVE_COUNT
              value: "5"
            - name: SQS_TOPOLOGY_VALIDATION_MODE
              value: "enforce"
          envFrom:
            - configMapRef:
                name: account-service
            - secretRef:
                name: account-service
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
spec:
  selector:
    app: account-service
  ports:
    - port: 80
      targetPort: 8080
---
# Autoscaling is KEDA (SQS depth), not a native CPU HPA — see keda-scaledobject.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: account-service
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: account-service
