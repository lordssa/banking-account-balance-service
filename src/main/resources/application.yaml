spring:
  application:
    name: account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/account}
    username: ${DB_USER:account}
    password: ${DB_PASSWORD:account}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ingestion.processing: true
        balance.returned_age_seconds: true
        db.operation: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/metrics}
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        enabled: ${OTEL_LOGS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/logs}

account:
  sqs:
    enabled: ${SQS_ENABLED:true}
    queue-url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/transacoes-financeiras-processadas}
    endpoint-override: ${AWS_ENDPOINT_OVERRIDE:http://localhost:4566}
    region: ${AWS_REGION:sa-east-1}
    max-concurrent: ${SQS_MAX_CONCURRENT:16}
    wait-time-seconds: 10
    visibility-timeout-seconds: 60
    max-receive-count: ${SQS_MAX_RECEIVE_COUNT:5}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
