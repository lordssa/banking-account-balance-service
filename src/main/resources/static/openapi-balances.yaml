openapi: 3.0.3
info:
  title: API de Consulta de Saldo de Conta
  version: 1.0.0
  description: >
    Consulta do saldo atual da conta. Retorna o snapshot de saldo mais recente
    aceito com sucesso. Não reconstrói saldos a partir do journal.
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /balances/{accountId}:
    get:
      operationId: getBalance
      summary: Consultar saldo atual da conta
      parameters:
        - name: accountId
          in: path
          required: true
          description: UUID da conta
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshot de saldo atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
              example:
                id: 5b19c8b6-0cc4-4c72-a989-0c2ee15fa975
                owner: 315e3cfe-f4af-4cd2-b298-a449e614349a
                balance:
                  amount: 183.12
                  currency: BRL
                updated_at: "2025-07-05T18:04:13.433-03:00"
        "400":
          description: Identificador de conta malformado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conta desconhecida (sem snapshot aceito)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Serviço temporariamente indisponível
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Falha inesperada (sem detalhes internos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    BalanceResponse:
      type: object
      required:
        - id
        - owner
        - balance
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Identificador da conta
        owner:
          type: string
          format: uuid
          description: Identificador do titular
        balance:
          $ref: "#/components/schemas/Balance"
        updated_at:
          type: string
          format: date-time
          description: Data/hora da última atualização (ISO 8601, horário de origem do evento vencedor)
    Balance:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          description: Valor do saldo (ISO / decimal JSON number)
          example: 183.12
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Código de moeda ISO 4217
          example: BRL
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ACCOUNT_NOT_FOUND
        message:
          type: string
          description: Mensagem estável e sem dados sensíveis
        correlationId:
          type: string
          description: Referência opaca de correlação
